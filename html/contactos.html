<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudio jurídico Lorem Ipsum-Contacto</title>
    <link rel="stylesheet" href="../css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/styles.css">

</head>
<body class="pagina-contacto">
    <header class="cabecera-contacto">
        <a href="../index.html" class="volver-inicio">
            &larr; Volver al inicio
        </a>
    </header>

    <main class="contenedor-contacto">
        <section class="tarjeta-contacto">
        <!-- Panel izquierdo -->
        <div class="contacto-informacion">
            <span class="simbolo-justicia">&#9878;</span>
            <h1>Hablemos de tu caso</h1>
            <p>
                En Lorem Ipsum creemos que cada situación
                merece atención y orientación personalizada.
            </p>
            <div class="linea-dorada"></div>
                <p>✦ Atención profesional</p>
                <p>✦ Trato cercano y personalizado</p>
                <p>✦ Compromiso con nuestros clientes</p>
        </div>
        <div class="contacto-formulario">
            <h2>Contáctanos</h2>
            <p>Completa el formulario y cuéntanos tu consulta.</p>

            <form class="formulario-contacto">
                <div class="campo-contacto">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre completo" autocomplete="name" required>
                </div>

                <div class="campo-contacto">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" autocomplete="email" required>
                </div>

                <div class="campo-contacto">
                    <label for="mensaje">Mensaje</label>
                    <textarea id="mensaje" name="mensaje" rows="5" placeholder="Cuéntanos brevemente tu consulta..." required></textarea>
                </div>

                <button type="submit" class="boton-enviar">
                    Enviar mensaje
                </button>
            </form>
        </div>
        </section>
    </main>
</body>
</html>
